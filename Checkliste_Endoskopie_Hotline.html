<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkliste Endoskopie-Hotline</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    color: #1a2332;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #0097a7 0%, #006978 100%);
    color: white;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .logo { font-size: 28px; }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; }
  header p  { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
  .header-right { margin-left: auto; }
  .btn-restart {
    background: rgba(255,255,255,0.2);
    border: 1.5px solid rgba(255,255,255,0.5);
    color: white;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.82rem;
    transition: background 0.2s;
    font-weight: 600;
  }
  .btn-restart:hover { background: rgba(255,255,255,0.35); }

  /* ── Layout ── */
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ── Breadcrumb ── */
  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 24px;
    align-items: center;
    min-height: 28px;
  }
  .crumb {
    background: white;
    border: 1px solid #d0dbe8;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 0.75rem;
    color: #4a6080;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .crumb-arrow { color: #90a8c0; font-size: 0.8rem; }

  /* ── Main card ── */
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card-header {
    padding: 20px 28px 18px;
    border-bottom: 1px solid #eef2f7;
  }
  .card-header .step-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #0097a7;
    margin-bottom: 6px;
  }
  .card-header h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1a2332;
    line-height: 1.35;
  }
  .card-body { padding: 24px 28px; }

  /* ── Question ── */
  .question {
    font-size: 1.05rem;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 8px;
  }
  .info-box {
    background: #fff8e1;
    border-left: 4px solid #ffc107;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 20px;
    font-size: 0.88rem;
    color: #5d4037;
    line-height: 1.55;
    white-space: pre-line;
  }
  .alarm-box {
    background: #fff3e0;
    border-left: 4px solid #ff5722;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 20px;
    font-size: 0.88rem;
    color: #bf360c;
    line-height: 1.6;
    white-space: pre-line;
  }
  .alarm-box strong { display: block; margin-bottom: 4px; font-size: 0.9rem; }

  /* ── Choice buttons ── */
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .btn-choice {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 20px;
    border: 2px solid #b2e0e8;
    background: #f0fafb;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    color: #004d60;
    text-align: left;
    transition: all 0.18s;
    line-height: 1.4;
  }
  .btn-choice:hover {
    background: #e0f4f7;
    border-color: #0097a7;
    transform: translateX(3px);
    box-shadow: 0 3px 12px rgba(0,151,167,0.15);
  }
  .btn-choice .icon { font-size: 1.3rem; flex-shrink: 0; }
  .btn-choice.urgent {
    border-color: #ffcdd2;
    background: #fff8f8;
    color: #b71c1c;
  }
  .btn-choice.urgent:hover {
    background: #ffebee;
    border-color: #e53935;
    box-shadow: 0 3px 12px rgba(229,57,53,0.15);
  }
  .btn-choice.emergency {
    border-color: #e53935;
    background: #ffebee;
    color: #b71c1c;
    font-weight: 700;
    border-width: 2.5px;
  }
  .btn-choice.emergency:hover {
    background: #ffcdd2;
    box-shadow: 0 3px 14px rgba(229,57,53,0.25);
  }
  .btn-choice.soft {
    border-color: #c8e6c9;
    background: #f1f8f2;
    color: #1b5e20;
  }
  .btn-choice.soft:hover {
    background: #e8f5e9;
    border-color: #388e3c;
  }

  /* ── Result screen ── */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .badge-ok      { background: #e8f5e9; color: #2e7d32; }
  .badge-urgent  { background: #fff3e0; color: #e65100; }
  .badge-danger  { background: #ffebee; color: #c62828; }

  .hinweis-box {
    background: #e3f2fd;
    border-left: 4px solid #1e88e5;
    padding: 12px 16px;
    border-radius: 0 10px 10px 0;
    margin-bottom: 20px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #0d47a1;
    line-height: 1.5;
  }
  .hinweis-urgent {
    background: #fff8e1;
    border-left-color: #fb8c00;
    color: #e65100;
  }
  .emergency-box {
    background: #ffebee;
    border: 2px solid #e53935;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    text-align: center;
  }
  .emergency-box .em-icon { font-size: 3rem; display: block; margin-bottom: 8px; }
  .emergency-box h3 { font-size: 1.4rem; color: #b71c1c; font-weight: 800; margin-bottom: 8px; }
  .emergency-box p { font-size: 0.95rem; color: #c62828; line-height: 1.5; }

  .section-title {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #607d8b;
    margin: 20px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ── Termin cards ── */
  .termin-grid { display: flex; flex-direction: column; gap: 10px; }
  .termin-card {
    border: 1.5px solid #b2dfdb;
    border-radius: 10px;
    overflow: hidden;
    background: white;
  }
  .termin-card-header {
    background: #e0f2f1;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 0.88rem;
    color: #00695c;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .termin-card-body {
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .termin-item label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #90a4ae;
    display: block;
    margin-bottom: 2px;
  }
  .termin-item span {
    font-size: 0.88rem;
    color: #263238;
    font-weight: 500;
    line-height: 1.4;
    display: block;
  }
  .termin-item .slot-pill {
    display: inline-block;
    background: #e3f2fd;
    color: #1565c0;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.82rem;
    margin: 1px 2px 1px 0;
  }
  .termin-item .kenn-pill {
    display: inline-block;
    background: #fce4ec;
    color: #880e4f;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-family: monospace;
  }

  /* ── Info Patient ── */
  .info-patient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 520px) { .info-patient-grid { grid-template-columns: 1fr; } }
  .info-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #f1f8f2;
    border: 1.5px solid #c8e6c9;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.86rem;
    color: #1b5e20;
    line-height: 1.45;
  }
  .info-item .icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }

  /* ── Footnotes ── */
  .footnotes {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed #cfd8dc;
    font-size: 0.75rem;
    color: #78909c;
    line-height: 1.6;
  }
  .footnotes p { margin-bottom: 4px; }

  /* ── Navigation ── */
  .nav-bar {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #eef2f7;
  }
  .btn-back {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    background: white;
    border: 1.5px solid #cfd8dc;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.88rem;
    color: #546e7a;
    font-weight: 600;
    transition: all 0.18s;
  }
  .btn-back:hover { background: #f5f7f9; border-color: #90a4ae; }
  .btn-back:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Progress bar ── */
  .progress-bar-wrap {
    background: #e0e9f0;
    border-radius: 4px;
    height: 5px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #0097a7, #26c6da);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
</style>
</head>

  <div class="card" id="mainCard"></div>
</div>

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════

let history = [];    // array of { nodeId, labelChosen }
let currentId = 'start';

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════

function render() {
  const node = NODES[currentId];
  if (!node) return;

  // Progress
  const depth = history.length;
  const maxDepth = 6;
  document.getElementById('progressBar').style.width =
    Math.min(100, (depth / maxDepth) * 100) + '%';

  // Breadcrumb
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  history.forEach((h, i) => {
    if (i > 0) bc.insertAdjacentHTML('beforeend', '<span class="crumb-arrow">›</span>');
    const d = document.createElement('span');
    d.className = 'crumb';
    d.title = h.labelChosen;
    d.textContent = h.labelChosen;
    bc.appendChild(d);
  });

  // Main card
  const card = document.getElementById('mainCard');

  if (node.type === 'result') {
    card.innerHTML = renderResult(node);
  } else {
    card.innerHTML = renderChoice(node);
  }
}

function renderChoice(node) {
  const alarmHTML = node.alarm
    ? `<div class="alarm-box"><strong>⚠️ Alarmsymptome / Hinweise:</strong>${escHtml(node.alarm)}</div>`
    : '';
  const infoHTML = node.info
    ? `<div class="info-box">${escHtml(node.info)}</div>`
    : '';

  const choicesHTML = node.choices.map((c, i) => {
    const cls = c.style === 'urgent' ? 'urgent' :
                c.style === 'emergency' ? 'emergency' :
                c.style === 'soft' ? 'soft' : '';
    return `<button class="btn-choice ${cls}" onclick="choose(${i})">
      <span class="icon">${c.icon || '▶'}</span>
      <span>${escHtml(c.label)}</span>
    </button>`;
  }).join('');

  return `
    <div class="card-header">
      <div class="step-label">Schritt ${history.length + 1}</div>
      <h2>${escHtml(node.title)}</h2>
    </div>
    <div class="card-body">
      ${alarmHTML}
      ${infoHTML}
      <p class="question">${escHtml(node.question)}</p>
      <div class="choices">${choicesHTML}</div>
      ${renderNavBar()}
    </div>`;
}

function renderResult(node) {
  const badgeMap = {
    ok:     { cls: 'badge-ok',     icon: '✅', text: 'Ergebnis' },
    urgent: { cls: 'badge-urgent', icon: '⚠️', text: 'Dringend' },
    danger: { cls: 'badge-danger', icon: '🚨', text: 'Notfall' },
  };
  const b = badgeMap[node.badge] || badgeMap.ok;

  // Emergency
  if (node.emergency) {
    return `
      <div class="card-header">
        <span class="result-badge ${b.cls}">${b.icon} ${b.text}</span>
        <h2>${escHtml(node.title)}</h2>
      </div>
      <div class="card-body">
        <div class="emergency-box">
          <span class="em-icon">🚨</span>
          <h3>RETTUNGSSTELLE</h3>
          <p>Bei Akutsymptomen (Blutbrechen, feststeckende Speisen, schwarzer Stuhl = Teerstuhl) den Patienten <strong>sofort an die Rettungsstelle</strong> verweisen!</p>
        </div>
        ${renderNavBar()}
      </div>`;
  }

  // No Einweisung GKV
  if (node.noEinweisung) {
    return `
      <div class="card-header">
        <span class="result-badge ${b.cls}">${b.icon} ${b.text}</span>
        <h2>${escHtml(node.title)}</h2>
      </div>
      <div class="card-body">
        <div class="hinweis-box">
          ℹ️ GKV-Patient benötigt eine <strong>Überweisung oder Einweisung vom Hausarzt / Facharzt</strong>.<br>
          Bitte den Patienten bitten, zunächst eine Überweisung beim Hausarzt oder Facharzt zu besorgen.
        </div>
        ${renderNavBar()}
      </div>`;
  }

  const hinweisHTML = node.hinweis
    ? `<div class="hinweis-box ${node.hinweisStyle === 'urgent' ? 'hinweis-urgent' : ''}">${escHtml(node.hinweis)}</div>`
    : '';

  const termineHTML = (node.termine && node.termine.length)
    ? `<p class="section-title">📅 Terminvergabe</p>
       <div class="termin-grid">${node.termine.map(renderTermin).join('')}</div>`
    : '';

  const infoHTML = (node.infoPatient && node.infoPatient.length)
    ? `<p class="section-title" style="margin-top:20px">📢 Info an Patient</p>
       <div class="info-patient-grid">${node.infoPatient.map(renderInfoItem).join('')}</div>`
    : '';

  return `
    <div class="card-header">
      <span class="result-badge ${b.cls}">${b.icon} ${b.text}</span>
      <h2>${escHtml(node.title)}</h2>
    </div>
    <div class="card-body">
      ${hinweisHTML}
      ${termineHTML}
      ${infoHTML}
      ${renderFootnotes()}
      ${renderNavBar()}
    </div>`;
}

function renderTermin(t) {
  const slotsHTML = t.slots.map(s =>
    `<span class="slot-pill">${escHtml(s)}</span>`
  ).join('');
  return `
    <div class="termin-card">
      <div class="termin-card-header">${t.icon} ${escHtml(t.label)}</div>
      <div class="termin-card-body">
        <div class="termin-item">
          <label>Zeitfenster</label>
          <span>${slotsHTML}</span>
        </div>
        <div class="termin-item">
          <label>Kalender</label>
          <span>${escHtml(t.kalender)}</span>
        </div>
        <div class="termin-item" style="grid-column:1/-1">
          <label>Kennzeichnung</label>
          <span class="kenn-pill">${escHtml(t.kennzeichnung)}</span>
        </div>
      </div>
    </div>`;
}

function renderInfoItem(item) {
  return `<div class="info-item"><span class="icon">${item.icon}</span><span>${escHtml(item.text)}</span></div>`;
}

function renderFootnotes() {
  return `
    <div class="footnotes">
      <p>* Untersuchungstermin und Aufklärungstermin für PP werden im Vorgespräch direkt durch Personal der Funktionsambulanz (L-Keller) vergeben.</p>
      <p>** PP mit Akutsymptomen im Gastro-Trakt können gleichzeitig beides erhalten (wie bei Gastro mit Alarmsymptomen).</p>
      <p>*** Wenn keine Termine innerhalb 48h verfügbar: Rücksprache mit Tel. Prof. Weylandt 3208 bzw. Fr. Wiese 3208 (Ltd. OA).</p>
      <p>⚠️ Aktuell sind Terminvergaben aufgrund Personalmangel eingeschränkt. Bei Alarmsymptomen und keinen L-Keller-Terminen: Rücksprache Tel. 3236 (Anmeldung Funktionsambulanz L-Keller).</p>
    </div>`;
}

function renderNavBar() {
  const canBack = history.length > 0;
  return `
    <div class="nav-bar">
      <button class="btn-back" onclick="goBack()" ${canBack ? '' : 'disabled'}>
        ← Zurück
      </button>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════════

function choose(index) {
  const node = NODES[currentId];
  const choice = node.choices[index];
  history.push({ nodeId: currentId, labelChosen: choice.label });
  currentId = choice.next;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (history.length === 0) return;
  const prev = history.pop();
  currentId = prev.nodeId;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  history = [];
  currentId = 'start';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

// ── Init ──
render();
</script>
